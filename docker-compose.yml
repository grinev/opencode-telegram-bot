services:
  opencode-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode-telegram-bot
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - OPENCODE_API_URL=${OPENCODE_API_URL:-http://127.0.0.1:4096}
      - OPENCODE_TELEGRAM_HOME=/app/data
      - OPENCODE_TELEGRAM_CONTAINER=1
    env_file:
      - .env
    volumes:
      - opencode-bot-data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  opencode-bot-data: