services:
  opencode-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode-telegram-bot
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - OPENCODE_API_URL=${OPENCODE_API_URL:-http://127.0.0.1:4096}
      - OPENCODE_TELEGRAM_HOME=/app/data
      - OPENCODE_TELEGRAM_CONTAINER=1
      - BOT_HEALTH_PORT=${BOT_HEALTH_PORT:-3100}
    env_file:
      - .env
    volumes:
      - opencode-bot-data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3100/health').then(r=>r.json()).then(j=>process.exit(j.status==='healthy'?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  opencode-bot-data:
YAL
echo "done"
